# Blueprint для Render: https://render.com/docs/blueprint-spec
#
# Приложение статическое по сути: весь контент лежит в коде, внешних
# сервисов и базы нет. Поэтому и переменных окружения не требуется —
# нужен только Node достаточно свежей версии.

services:
  - type: web
    name: uzbekistan-travel
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: 24.13.0

      # Пароль админ-панели и подписи сессий. Render сгенерирует их сам
      # при первом развёртывании — посмотреть можно в разделе Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Почта. Пока не заданы, коды подтверждения и ссылки на смену
      # пароля не уходят письмом — их передаёт оператор из панели.
      # Подойдёт любой SMTP: Яндекс, Gmail с паролем приложения, Mail.ru.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # ИИ-гид в разделе HelloUZ. Без ключа гид отвечает только на быстрые
      # вопросы-подсказки. Ключ — на console.anthropic.com.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Push-уведомления на телефон. Ключи: npx web-push generate-vapid-keys
      # (один раз — при смене все подписки устройств отвалятся). SUBJECT —
      # mailto:адрес для связи со службой браузера. Без всех трёх push
      # выключен, уведомления видны только в колокольчике приложения.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # Оплата и eSIM. Секретные ключи Payme/Click нужны, чтобы платёжная
      # система сама подтверждала оплату; без подтверждения eSIM не выдаётся.
      # Адреса для кабинетов Payme и Click — в админке, раздел «eSIM».
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_SECRET
        sync: false
      - key: AIRALO_CLIENT_ID
        sync: false
      - key: AIRALO_CLIENT_SECRET
        sync: false

      # Адрес лендинга (например https://hellouz.uz): ему разрешено
      # показывать приложение в рамке «живого демо». Админку — никогда.
      - key: LANDING_ORIGIN
        sync: false
