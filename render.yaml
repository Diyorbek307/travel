# Blueprint для Render: https://render.com/docs/blueprint-spec
#
# Приложение статическое по сути: весь контент лежит в коде, внешних
# сервисов и базы нет. Поэтому и переменных окружения не требуется —
# нужен только Node достаточно свежей версии.

services:
  - type: web
    name: uzbekistan-travel
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: 24.13.0

      # Пароль админ-панели и подписи сессий. Render сгенерирует их сам
      # при первом развёртывании — посмотреть можно в разделе Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Почта. Пока не заданы, коды подтверждения и ссылки на смену
      # пароля не уходят письмом — их передаёт оператор из панели.
      # Подойдёт любой SMTP: Яндекс, Gmail с паролем приложения, Mail.ru.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
