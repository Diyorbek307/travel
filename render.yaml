# Blueprint для Render: https://render.com/docs/blueprint-spec
#
# Развёртывание одним сервисом: Next.js отдаёт и приложение туриста,
# и админ-панель, и API. Отдельная база не нужна — данные лежат в SQLite.
#
# ВАЖНО о хранении данных. По умолчанию сервис поднимается на бесплатном
# тарифе, у которого нет постоянного диска: файловая система контейнера
# обнуляется при каждом перезапуске и деплое. Демо-контент восстанавливается
# автоматически (команда запуска сама наполняет пустую базу), но правки,
# сделанные через админ-панель, загруженные аудиогиды и накопленная
# аналитика при перезапуске пропадут.
#
# Чтобы данные сохранялись, нужен платный тариф с диском — раскомментируйте
# блок `disk` ниже и смените `plan` на `starter`.

services:
  - type: web
    name: uzbekistan-travel
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build
    # Пустая база наполняется демо-контентом; уже заполненная не трогается,
    # поэтому при подключённом диске правки редакторов переживают деплой.
    startCommand: npm run seed:if-empty && npm start

    healthCheckPath: /api/cities

    envVars:
      # node:sqlite встроен в Node начиная с 22.5 — на более старой версии
      # приложение просто не запустится.
      - key: NODE_VERSION
        value: 24.13.0

      # Пароль админ-панели. Render сгенерирует случайный при первом деплое,
      # посмотреть его можно в разделе Environment.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true

      # Адрес для QR-кодов подставляется автоматически из RENDER_EXTERNAL_URL.
      # Отдельная переменная APP_BASE_URL нужна только при подключении
      # собственного домена — добавьте её тогда прямо в разделе Environment.

      # Каталог изменяемых данных. Значение имеет смысл только вместе
      # с диском — раскомментируйте обе секции сразу.
      # - key: DATA_DIR
      #   value: /var/data

    # Постоянный диск. Недоступен на бесплатном тарифе: вместе с ним
    # смените plan на starter.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
