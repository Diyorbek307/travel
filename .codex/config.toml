[mcp_servers.21st]
url = "https://21st.dev/api/mcp"

[mcp_servers.21st.env_http_headers]
x-api-key = "API_KEY_21ST"

[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp"]

[mcp_servers.context7]
command = "npx"
args = [
    "-y",
    "@upstash/context7-mcp",
]

[mcp_servers.shadcn]
command = "npx"
args = [
    "-y",
    "shadcn@latest",
    "mcp",
]
