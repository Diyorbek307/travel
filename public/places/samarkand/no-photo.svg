<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice">
  <!-- Обложка для мест, у которых пока нет свободного фото: орнамент гирих в цветах HelloUZ. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e6f68"/>
      <stop offset="1" stop-color="#0a3f3b"/>
    </linearGradient>
    <pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#34dccf" stroke-opacity="0.32" stroke-width="2">
        <path d="M40 4 L52 28 L76 40 L52 52 L40 76 L28 52 L4 40 L28 28 Z"/>
