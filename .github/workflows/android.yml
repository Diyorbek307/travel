# Сборка Android APK в облаке.
#
# APK можно собрать и на своём компьютере, но здесь он собирается на
# чистой машине GitHub — так его можно скачать со страницы Actions без
# доступа к твоему ПК, и сборка всегда воспроизводимая. Это отладочный
# (debug) APK: ставится на телефон для проверки, для Google Play нужна
# отдельная подписанная (release) сборка.
name: Android (APK)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать веб-часть в проект
        run: npx cap sync android

      - name: Собрать debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: uzup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
