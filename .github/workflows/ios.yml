# Сборка iOS-приложения в облаке.
#
# Собрать под iPhone можно только на macOS, а у публичного репозитория
# GitHub даёт macOS-раннеры бесплатно. Здесь оболочка Capacitor собирается
# под симулятор без подписи — этого достаточно, чтобы увидеть работающее
# приложение и снять скриншот. Подпись и выгрузка в App Store добавятся
# отдельным шагом, когда появится аккаунт Apple Developer.
name: iOS (симулятор)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {} # можно запускать вручную кнопкой в GitHub

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Установить зависимости
        run: npm ci

      - name: Создать iOS-проект
        # Без маскировки ошибок: если cap add упадёт — увидим это здесь, а
        # не глубже. cap add уже копирует шаблон и ставит поды.
        run: npx cap add ios

      - name: Синхронизировать
        run: npx cap sync ios

      - name: Установить поды
        # Podfile ищем, где бы он ни лежал, и ставим поды рядом с ним —
        # именно pod install создаёт App.xcworkspace. Нет Podfile — значит
        # проект не собрался; выводим дерево в аннотации и падаем.
        run: |
          set +e
          POD=$(find ios -name Podfile -maxdepth 4 2>/dev/null | head -1)
          echo "Podfile: ${POD:-не найден}"
          if [ -z "$POD" ]; then
            echo "::error::Podfile не найден после cap add ios — проект не создался"
            find ios -maxdepth 3 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::дерево: $l"; done
            exit 1
          fi
          cd "$(dirname "$POD")"
          pod install 2>&1 | tee /tmp/pod.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -iE "error|\[!\]|unable|could not|conflict|require" /tmp/pod.log | tail -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi

      - name: Собрать под симулятор (без подписи)
        # Без -destination: собираем под SDK симулятора. Три флага подписи
        # вместе полностью её выключают. Ошибку xcodebuild выводим через
        # ::error::, чтобы она попала в аннотации сборки.
        run: |
          echo "== схемы =="
          xcodebuild -list -workspace ios/App/App.xcworkspace 2>&1 | head -40 || true
          set +e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::xcodebuild завершился с кодом $code"
            grep -iE "error:|does not contain|no scheme|cannot |ld: |fatal|not found" xcode.log | tail -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$code"
          fi

      - name: Запустить в симуляторе и снять экран
        run: |
          set +e
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone 1[5-9]' | head -1)
          DEVICE=${DEVICE:-iPhone 15}
          echo "Симулятор: $DEVICE"
          xcrun simctl boot "$DEVICE"
          sleep 5
          APP=$(find build/Build/Products -name 'App.app' -type d | head -1)
          echo "Приложение: $APP"
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted uz.uzup.app
          sleep 14
          xcrun simctl io booted screenshot app-iphone.png
          echo "готово"

      - name: Выложить сборку и скриншот
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-приложение
          path: |
            build/Build/Products/**/App.app
            app-iphone.png
            xcode.log
          if-no-files-found: warn
